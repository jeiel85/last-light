name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The game is entirely static: build it, upload it, publish it. There is no server.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # A project page is served from /<repo>/, so the bundle needs that base path.
          LASTLIGHT_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Prepare the artifact
        run: |
          # Pages runs Jekyll unless told not to, which eats files beginning with _.
          touch dist/.nojekyll
          # A single page with no routing, but a stray deep link should still load the game.
          cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The gates that have to hold before anything ships: types, lint, content integrity,
# the unit and integration suites, a production build, and the browser suite against it.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run validate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Balance is data, not opinion: a change that breaks the economy shows up here as a
      # warning in the log rather than as a review comment three weeks later.
      - name: Balance simulation
        run: npm run simulate -- --runs 300
